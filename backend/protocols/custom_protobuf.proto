// ZAID PERSONAL CRYPTO TRADING BOT - Stage 24
// Custom Protocol Buffers for Internal IPC (Ray Actors)
// Lightweight message definitions for inter-process communication
// Optimized for minimal serialization overhead and cross-language compatibility

syntax = "proto3";

package zaid.trading.protocol;

// ============================================================================
// Core Message Types for Ray Actor Communication
// ============================================================================

// High-frequency tick data message
message TickMessage {
    string symbol = 1;
    int64 timestamp_ns = 2;
    double price = 3;
    double quantity = 4;
    Side side = 5;
    uint64 trade_id = 6;
    uint64 sequence_id = 7;
    string exchange = 8;
}

// Order book level update
message LevelUpdate {
    double price = 1;
    double quantity = 2;
    uint32 order_count = 3;
    UpdateType update_type = 4;
}

// Full order book snapshot
message OrderBookSnapshot {
    string symbol = 1;
    int64 timestamp_ns = 2;
    repeated LevelUpdate bids = 3;
    repeated LevelUpdate asks = 4;
    uint64 sequence_id = 5;
}

// Incremental order book update
message OrderBookUpdate {
    string symbol = 1;
    int64 timestamp_ns = 2;
    uint64 sequence_id = 3;
    uint64 prev_sequence_id = 4;
    repeated LevelUpdate bids_added = 5;
    repeated double bids_removed = 6;
    repeated LevelUpdate asks_added = 7;
    repeated double asks_removed = 8;
    bool is_snapshot = 9;
}

// Trading signal from strategy engine
message TradingSignal {
    string signal_id = 1;
    string symbol = 2;
    int64 timestamp_ns = 3;
    SignalType signal_type = 4;
    Direction direction = 5;
    float strength = 6;
    float confidence = 7;
    double target_price = 8;
    double stop_loss = 9;
    double position_size = 10;
    int64 ttl_ns = 11;
    repeated string source_models = 12;
    float microstructure_score = 13;
    float toxicity_level = 14;
}

// Execution order to OMS
message ExecutionOrder {
    string order_id = 1;
    string signal_id = 2;
    string symbol = 3;
    int64 timestamp_ns = 4;
    Side side = 5;
    OrderType order_type = 6;
    double quantity = 7;
    double limit_price = 8;
    double stop_price = 9;
    TimeInForce time_in_force = 10;
    bool post_only = 11;
    bool reduce_only = 12;
    string client_order_id = 13;
    string strategy_id = 14;
    uint32 priority = 15;
}

// Execution report from exchange gateway
message ExecutionReport {
    string order_id = 1;
    string client_order_id = 2;
    string symbol = 3;
    int64 timestamp_ns = 4;
    ExecType exec_type = 5;
    OrderStatus order_status = 6;
    Side side = 7;
    OrderType order_type = 8;
    double quantity = 9;
    double filled_quantity = 10;
    double remaining_quantity = 11;
    double average_price = 12;
    double last_filled_price = 13;
    double last_filled_quantity = 14;
    double commission = 15;
    string commission_asset = 16;
    uint64 trade_id = 17;
    string execution_id = 18;
    string reject_reason = 19;
}

// Risk metrics snapshot
message RiskMetrics {
    int64 timestamp_ns = 1;
    double total_exposure = 2;
    double net_exposure = 3;
    double var_95 = 4;
    double var_99 = 5;
    double max_drawdown = 6;
    double current_pnl = 7;
    double realized_pnl = 8;
    double unrealized_pnl = 9;
    float sharpe_ratio = 10;
    float leverage = 11;
    double margin_used = 12;
    double margin_available = 13;
    uint32 position_count = 14;
    uint32 breach_flags = 15;
}

// System health check
message SystemHealth {
    int64 timestamp_ns = 1;
    float cpu_usage = 2;
    uint64 memory_used = 3;
    uint64 memory_total = 4;
    int64 network_latency_ns = 5;
    int64 exchange_latency_ns = 6;
    uint32 message_queue_depth = 7;
    int64 gc_pause_ns = 8;
    int64 serialization_overhead_ns = 9;
    int64 deserialization_overhead_ns = 10;
    uint32 error_count = 11;
    uint32 warning_count = 12;
}

// Spoofing detection alert
message SpoofingAlert {
    string alert_id = 1;
    string symbol = 2;
    int64 timestamp_ns = 3;
    AlertType alert_type = 4;
    double suspicious_price = 5;
    double suspicious_quantity = 6;
    int64 time_to_cancel_ns = 7;
    float confidence = 8;
    repeated string detected_patterns = 9;
    double estimated_pnl_impact = 10;
}

// Market impact analysis result
message ImpactAnalysis {
    string symbol = 1;
    int64 timestamp_ns = 2;
    double order_size = 3;
    double expected_impact_bps = 4;
    double permanent_impact = 5;
    double temporary_impact = 6;
    double market_resilience = 7;
    string model_used = 8;
    float confidence = 9;
}

// Hawkes process intensity update
message HawkesIntensity {
    string symbol = 1;
    int64 timestamp_ns = 2;
    double market_order_intensity = 3;
    double limit_order_intensity = 4;
    double cancellation_intensity = 5;
    double branching_ratio = 6;
    double baseline_intensity = 7;
    float stability_score = 8;
}

// VPIN (Volume-Synchronized Probability of Informed Trading) update
message VpinUpdate {
    string symbol = 1;
    int64 timestamp_ns = 2;
    float vpin_value = 3;
    uint32 bucket_count = 4;
    double total_buy_volume = 5;
    double total_sell_volume = 6;
    float toxicity_classification = 7;
}

// Batch container for high-throughput messaging
message MessageBatch {
    int64 batch_timestamp_ns = 1;
    repeated TickMessage ticks = 2;
    repeated OrderBookUpdate book_updates = 3;
    repeated TradingSignal signals = 4;
    repeated ExecutionReport reports = 5;
}

// Heartbeat message for actor liveness
message Heartbeat {
    string actor_id = 1;
    int64 timestamp_ns = 2;
    uint64 messages_processed = 3;
    float latency_p99_ms = 4;
    bool healthy = 5;
}

// Control commands for system management
message ControlCommand {
    CommandType command_type = 1;
    string target_actor = 2;
    string parameter = 3;
    int64 timestamp_ns = 4;
}

// Configuration update message
message ConfigUpdate {
    string config_key = 1;
    string config_value = 2;
    ConfigType config_type = 3;
    int64 timestamp_ns = 4;
    bool requires_restart = 5;
}

// ============================================================================
// Enumerations
// ============================================================================

enum Side {
    SIDE_UNKNOWN = 0;
    SIDE_BUY = 1;
    SIDE_SELL = 2;
}

enum OrderType {
    ORDER_TYPE_UNKNOWN = 0;
    ORDER_TYPE_MARKET = 1;
    ORDER_TYPE_LIMIT = 2;
    ORDER_TYPE_STOP_LOSS = 3;
    ORDER_TYPE_STOP_LIMIT = 4;
    ORDER_TYPE_TAKE_PROFIT = 5;
}

enum TimeInForce {
    TIME_IN_FORCE_GTC = 0;
    TIME_IN_FORCE_IOC = 1;
    TIME_IN_FORCE_FOK = 2;
    TIME_IN_FORCE_GTD = 3;
    TIME_IN_FORCE_DAY = 4;
}

enum ExecType {
    EXEC_TYPE_NEW = 0;
    EXEC_TYPE_PARTIAL_FILL = 1;
    EXEC_TYPE_FILL = 2;
    EXEC_TYPE_CANCELLED = 3;
    EXEC_TYPE_REJECTED = 4;
    EXEC_TYPE_REPLACED = 5;
    EXEC_TYPE_EXPIRED = 6;
}

enum OrderStatus {
    ORDER_STATUS_NEW = 0;
    ORDER_STATUS_PARTIALLY_FILLED = 1;
    ORDER_STATUS_FILLED = 2;
    ORDER_STATUS_CANCELLED = 3;
    ORDER_STATUS_PENDING_CANCEL = 4;
    ORDER_STATUS_REJECTED = 5;
    ORDER_STATUS_EXPIRED = 6;
}

enum SignalType {
    SIGNAL_TYPE_UNKNOWN = 0;
    SIGNAL_TYPE_MOMENTUM = 1;
    SIGNAL_TYPE_MEAN_REVERSION = 2;
    SIGNAL_TYPE_ARBITRAGE = 3;
    SIGNAL_TYPE_MARKET_MAKING = 4;
    SIGNAL_TYPE_LIQUIDITY_DETECTION = 5;
    SIGNAL_TYPE_SPOOFING_ALERT = 6;
}

enum Direction {
    DIRECTION_NEUTRAL = 0;
    DIRECTION_LONG = 1;
    DIRECTION_SHORT = 2;
}

enum UpdateType {
    UPDATE_TYPE_ADD = 0;
    UPDATE_TYPE_MODIFY = 1;
    UPDATE_TYPE_REMOVE = 2;
}

enum AlertType {
    ALERT_TYPE_UNKNOWN = 0;
    ALERT_TYPE_FAST_CANCEL = 1;
    ALERT_TYPE_LAYERING = 2;
    ALERT_TYPE_SPOOF_WALL = 3;
    ALERT_TYPE_MOMENTUM_IGNITION = 4;
}

enum CommandType {
    COMMAND_TYPE_START = 0;
    COMMAND_TYPE_STOP = 1;
    COMMAND_TYPE_PAUSE = 2;
    COMMAND_TYPE_RESUME = 3;
    COMMAND_TYPE_FLUSH = 4;
    COMMAND_TYPE_RECONFIGURE = 5;
    COMMAND_TYPE_SHUTDOWN = 6;
}

enum ConfigType {
    CONFIG_TYPE_STRING = 0;
    CONFIG_TYPE_INT = 1;
    CONFIG_TYPE_FLOAT = 2;
    CONFIG_TYPE_BOOL = 3;
    CONFIG_TYPE_JSON = 4;
}

// ============================================================================
// Service Definitions (for gRPC if needed)
// ============================================================================

service TradingDataService {
    rpc StreamTicks(stream TickMessage) returns (stream Ack);
    rpc StreamOrderBook(stream OrderBookUpdate) returns (stream Ack);
    rpc SendSignal(TradingSignal) returns (Ack);
    rpc SubmitOrder(ExecutionOrder) returns (ExecutionReport);
    rpc GetRiskMetrics(RiskRequest) returns (RiskMetrics);
    rpc GetSystemHealth(HealthRequest) returns (SystemHealth);
}

service AnalyticsService {
    rpc AnalyzeImpact(ImpactRequest) returns (ImpactAnalysis);
    rpc CalculateVpin(VpinRequest) returns (VpinUpdate);
    rpc DetectSpoofing(SpoofingRequest) returns (SpoofingAlert);
}

// Simple acknowledgment message
message Ack {
    bool success = 1;
    string message = 2;
    int64 timestamp_ns = 3;
}

message RiskRequest {
    string portfolio_id = 1;
    int64 timestamp_ns = 2;
}

message HealthRequest {
    string actor_id = 1;
    int64 timestamp_ns = 2;
}

message ImpactRequest {
    string symbol = 1;
    double order_size = 2;
    Side side = 3;
    int64 timestamp_ns = 4;
}

message VpinRequest {
    string symbol = 1;
    int64 lookback_ns = 2;
    uint32 bucket_size = 3;
}

message SpoofingRequest {
    string symbol = 1;
    int64 lookback_ns = 2;
    float sensitivity = 3;
}
